---

- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: yes
  when:
    - not is_container | bool

- name: Restart velociraptor-server
  ansible.builtin.systemd:
    name: velociraptor
    state: restarted
    enabled: true
  when:
    - not is_container|bool

- name: URL
  ansible.builtin.debug:
    msg: "You can reach Velociraptor via https://{{ ansible_facts['default_ipv4'].address }}:8889/"

- name: Restart velociraptor nix client
  ansible.builtin.systemd:
    name: velociraptor-client
    state: restarted
  when:
    - not is_container|bool

- name: Restart velociraptor windows client
  ansible.windows.win_service:
    name: Velociraptor
    state: restarted
